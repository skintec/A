<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Animaciones Muralia</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&family=Oswald:wght@400;500&display=swap">
<link rel="stylesheet" href="../brand/tokens/tokens.css">
<style>
body{margin:0;padding:24px 16px;background:var(--paper);color:var(--graphite);font-family:var(--font-body)}
h1{font-family:var(--font-heading);font-weight:400;font-size:40px;margin:0 0 24px;text-transform:uppercase}
.grid{display:grid;gap:20px;grid-template-columns:repeat(auto-fit,minmax(300px,1fr))}
figure{margin:0;background:var(--plaster)}
figure img{display:block;width:100%;height:260px;object-fit:contain;background:var(--paper)}
figcaption{padding:12px 16px;font-size:14px;border-top:3px solid var(--clay)}
</style></head><body>
<h1>Muralia — animaciones</h1>
<div class="grid">
<figure><img src="logo-reveal.svg" alt="Logo"><figcaption>logo-reveal.svg — revelado del logo oficial</figcaption></figure>
<figure><img src="grillado.svg" alt="Grillado"><figcaption>grillado.svg — composición en grilla</figcaption></figure>
<figure><img src="capas.svg" alt="Capas"><figcaption>capas.svg — sistema de aislación en capas</figcaption></figure>
<figure><img src="loader.svg" alt="Cargando"><figcaption>loader.svg — cargador</figcaption></figure>
<figure><img src="hero-grid.svg" alt="Fondo"><figcaption>hero-grid.svg — fondo técnico para portada</figcaption></figure>
</div></body></html>
