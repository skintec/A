<style>
@font-face{font-family:Anton;src:url(stories/fonts/anton.ttf)}
@font-face{font-family:Oswald;font-weight:400;src:url(stories/fonts/oswald-400.ttf)}
@font-face{font-family:Oswald;font-weight:500;src:url(stories/fonts/oswald-500.ttf)}
:root{--clay:#C2551F;--clay-dark:#9C4318;--moss:#3E4A3C;--graphite:#2B2A26;--plaster:#EFE7DA;--paper:#FFFDF9}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--graphite);font:400 18px/1.4 Oswald,system-ui,sans-serif}
header,section{max-width:1160px;margin:0 auto;padding:32px 16px}
header{display:flex;align-items:center;gap:20px;border-bottom:4px solid var(--clay)}
header img{width:72px;height:72px}
h1,h2{font:400 clamp(32px,6vw,56px)/1 Anton;text-transform:uppercase;margin:0}
h2{font-size:34px;margin-bottom:20px}
.grid{display:grid;gap:20px;grid-template-columns:repeat(auto-fill,minmax(240px,1fr))}
.st video{aspect-ratio:9/16}
.wide{grid-template-columns:repeat(auto-fill,minmax(320px,1fr))}
figure{margin:0;background:var(--plaster);border-top:4px solid var(--clay)}
video,figure>img{display:block;width:100%;background:var(--graphite)}
figcaption{padding:12px 14px;display:flex;justify-content:space-between;gap:8px;align-items:center;font-size:16px}
figcaption a{color:var(--clay-dark);font-weight:500;margin-left:10px}
.b{font-weight:500}
footer{padding:24px 16px;text-align:center;font-size:14px;color:var(--moss)}
</style></head><body>
