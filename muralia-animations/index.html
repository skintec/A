<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Animaciones muralia.cl</title>
<style>
:root{--ink:#2B2D42;--cream:#F8F4EC}
body{margin:0;padding:24px 16px;background:var(--cream);color:var(--ink);font-family:system-ui,sans-serif}
h1{font-weight:800;margin:0 0 24px}
.grid{display:grid;gap:20px;grid-template-columns:repeat(auto-fit,minmax(300px,1fr))}
figure{margin:0;background:#fff;border-radius:16px;overflow:hidden;box-shadow:0 4px 18px #0001}
figure img{display:block;width:100%;height:240px;object-fit:contain;background:#F8F4EC}
figcaption{padding:12px 16px;font-size:14px}
@media (prefers-reduced-motion:reduce){img{animation:none}}
</style></head><body>
<h1>muralia.cl — animaciones</h1>
<div class="grid">
<figure><img src="logo-reveal.svg" alt="Logo"><figcaption>logo-reveal.svg — revelado del logotipo</figcaption></figure>
<figure><img src="paint-drips.svg" alt="Goteo"><figcaption>paint-drips.svg — pintura goteando (cabecera)</figcaption></figure>
<figure><img src="brush-loader.svg" alt="Loader"><figcaption>brush-loader.svg — cargador</figcaption></figure>
<figure><img src="hero-blobs.svg" alt="Fondo"><figcaption>hero-blobs.svg — fondo para portada</figcaption></figure>
<figure><img src="mosaic.svg" alt="Mosaico"><figcaption>mosaic.svg — muro que se pinta solo</figcaption></figure>
</div></body></html>
