<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" role="img" aria-label="Pintura goteando">
  <style>
    .d{transform-box:fill-box;transform-origin:top;animation:drip 5s cubic-bezier(.5,0,.3,1) infinite}
    @keyframes drip{0%{transform:scaleY(0)}45%,80%{transform:scaleY(1)}100%{transform:scaleY(0);transform-origin:bottom}}
  </style>
  <rect width="800" height="400" fill="#F8F4EC"/>
  <g>
    <rect y="0" width="800" height="60" fill="#2B2D42"/>
    <g fill="#FF3D57"><rect class="d" x="40"  width="60" height="260" rx="30" style="animation-delay:0s"/></g>
    <g fill="#FFB703"><rect class="d" x="170" width="46" height="190" rx="23" style="animation-delay:.4s"/></g>
    <g fill="#00B4D8"><rect class="d" x="290" width="70" height="320" rx="35" style="animation-delay:.8s"/></g>
    <g fill="#7B2CBF"><rect class="d" x="440" width="50" height="220" rx="25" style="animation-delay:1.2s"/></g>
    <g fill="#FF3D57"><rect class="d" x="560" width="64" height="290" rx="32" style="animation-delay:.2s"/></g>
    <g fill="#FFB703"><rect class="d" x="690" width="48" height="200" rx="24" style="animation-delay:.7s"/></g>
  </g>
</svg>
